name: Radio Atlas OpenWebRX Live Audio QA

# Manual only: a run temporarily occupies one receiver slot.
# The regular browser QA workflow always exercises the recorded-stream path.
on:
  workflow_dispatch:
    inputs:
      receiver:
        description: 'One exact HTTPS OpenWebRX catalogue URL (temporarily occupies one slot)'
        required: true
        default: 'https://sdr.v4.si/'
        type: string

permissions:
  contents: read

concurrency:
  group: openwebrx-live-audio-qa
  cancel-in-progress: false

jobs:
  live-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ephemeral Chromium QA dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify direct live OpenWebRX PCM in the custom Radio Atlas player
        env:
          RADIO_QA_BASE: http://127.0.0.1:8000/
          OWRX_QA_LIVE: '1'
          OWRX_QA_RECEIVER: ${{ inputs.receiver || 'https://sdr.v4.si/' }}
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/radio-atlas-openwebrx-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          STARTED=0
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null 2>&1; then STARTED=1; break; fi
            sleep 1
          done
          if [ "$STARTED" != "1" ]; then
            cat /tmp/radio-atlas-openwebrx-server.log
            exit 1
          fi
          node scripts/openwebrx_audio_qa.cjs
      - name: Upload live audio measurements and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radio-atlas-openwebrx-live-audio-evidence
          path: artifacts/openwebrx-audio-qa/
          if-no-files-found: warn
