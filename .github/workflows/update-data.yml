name: Update data and deploy Radio Atlas

on:
  schedule:
    # Official and internet radio station catalog: once daily.
    - cron: "17 2 * * *"
    # SDR directory, space weather and shortwave schedule: every 6 hours.
    - cron: "11 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Data group to refresh"
        type: choice
        options: [all, stations, sdr]
        default: all

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radio-atlas-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Select refresh mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "17 2 * * *" ]]; then
              echo "mode=stations" >> "$GITHUB_OUTPUT"
            else
              echo "mode=sdr" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=all" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate frontend syntax
        run: node --check js/app.js
      - name: Run selected data refresh
        run: python scripts/update_data.py "${{ steps.mode.outputs.mode }}"
      - name: Commit data snapshot
        run: |
          git config user.name "radio-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git add countries/ sitemap.xml robots.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh ${{ steps.mode.outputs.mode }} snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase origin main
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
