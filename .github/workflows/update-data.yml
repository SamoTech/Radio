name: Update data and deploy Radio Atlas

on:
  schedule:
    # Official and internet radio station catalog: once daily.
    - cron: "17 2 * * *"
    # SDR directory, space weather and shortwave schedule: every 6 hours.
    - cron: "11 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Data group to refresh"
        type: choice
        options: [all, stations, sdr]
        default: all

permissions:
  contents: read

concurrency:
  group: radio-atlas-pipeline
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Select refresh mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "17 2 * * *" ]]; then
              echo "mode=stations" >> "$GITHUB_OUTPUT"
            else
              echo "mode=sdr" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            # A code/docs push publishes the existing catalog immediately.
            # Scheduled daily station refresh and 6-hour SDR refresh remain intact.
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
      # Optional last tier of the fetch strategy engine: a real Chrome TLS
      # fingerprint for hosts that fingerprint the handshake. The crawler
      # degrades gracefully when this install fails (the tier is skipped).
      - name: Install the scraper's optional curl_cffi TLS tier
        if: steps.mode.outputs.mode != 'none'
        run: pip install "curl_cffi>=0.7"
        continue-on-error: true
      - name: Validate frontend syntax
        run: node --check js/app.js
      - name: Run selected data refresh
        if: steps.mode.outputs.mode != 'none'
        run: python scripts/update_data.py "${{ steps.mode.outputs.mode }}"
      - name: Commit data snapshot
        if: steps.mode.outputs.mode != 'none'
        run: |
          git config user.name "radio-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git add countries/ genres/ languages/ sitemap.xml robots.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh ${{ steps.mode.outputs.mode }} snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            # The pipeline is serialized by the concurrency group, but a queued
            # run can still commit on top of an older checkout while a newer data
            # snapshot lands on main first. Rebase conflicts on data/ are resolved
            # in favor of this run (the freshest crawl) - code files never conflict.
            git pull --rebase -X theirs origin main
            git push
          fi

  deploy:
    timeout-minutes: 20
    needs: update
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Stage validated public runtime assets
        run: python3 scripts/stage_production.py --output "$RUNNER_TEMP/radio-atlas-public"
      - name: Stamp actual checked-out source and asset digests
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/deployment_provenance.py stamp --root "$RUNNER_TEMP/radio-atlas-public" --commit "$(git rev-parse HEAD)"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/radio-atlas-public
      - name: Deploy exact uploaded artifact through Pages API
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 scripts/pages_deploy.py \
            --artifact-id "$PAGES_ARTIFACT_ID" \
            --artifact-name "$PAGES_ARTIFACT_NAME" \
            --source-sha "$PAGES_SOURCE_SHA" \
            --descriptor "$RUNNER_TEMP/radio-atlas-public/build-info.json" \
            --state-file "$RUNNER_TEMP/pages-deployment-${{ github.run_id }}.json"

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.deploy.outputs.source_sha }}
      - name: Verify actual public Pages commit and asset hashes
        run: |
          set -o pipefail
          python3 scripts/deployment_provenance.py verify --commit "${{ needs.deploy.outputs.source_sha }}" --attempts 20 --delay 6 2>&1 | tee production-verification.log
      - name: Upload deployed release verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radio-atlas-production-provenance
          path: production-verification.log
          if-no-files-found: warn
