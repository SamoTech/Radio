name: Update data and deploy Radio Atlas

on:
  schedule:
    # Official and internet radio station catalog: once daily.
    - cron: "17 2 * * *"
    # SDR directory, space weather and shortwave schedule: every 6 hours.
    - cron: "11 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Data group to refresh"
        type: choice
        options: [all, stations, sdr]
        default: all

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radio-atlas-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5
        with:
          node-version: "22"
      - name: Select refresh mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "17 2 * * *" ]]; then
              echo "mode=stations" >> "$GITHUB_OUTPUT"
            else
              echo "mode=sdr" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            # A code/docs push publishes the existing catalog immediately.
            # Scheduled daily station refresh and 6-hour SDR refresh remain intact.
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
      # Optional last tier of the fetch strategy engine: a real Chrome TLS
      # fingerprint for hosts that fingerprint the handshake. The crawler
      # degrades gracefully when this install fails (the tier is skipped).
      - name: Install the scraper's optional curl_cffi TLS tier
        if: steps.mode.outputs.mode != 'none'
        run: pip install "curl_cffi>=0.7"
        continue-on-error: true
      - name: Validate frontend syntax
        run: node --check js/app.js
      - name: Run selected data refresh
        if: steps.mode.outputs.mode != 'none'
        run: python scripts/update_data.py "${{ steps.mode.outputs.mode }}"
      - name: Commit data snapshot
        if: steps.mode.outputs.mode != 'none'
        run: |
          git config user.name "radio-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git add countries/ genres/ languages/ sitemap.xml robots.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh ${{ steps.mode.outputs.mode }} snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            # The pipeline is serialized by the concurrency group, but a queued
            # run can still commit on top of an older checkout while a newer data
            # snapshot lands on main first. Rebase conflicts on data/ are resolved
            # in favor of this run (the freshest crawl) - code files never conflict.
            git pull --rebase -X theirs origin main
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Stamp actual checked-out source and asset digests
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/deployment_provenance.py stamp --commit "$(git rev-parse HEAD)"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: .
      - name: Wait for this attempt's unique Pages artifact metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          name = os.environ["PAGES_ARTIFACT_NAME"]
          query = urllib.parse.urlencode({"name": name, "per_page": 100})
          url = (os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"]
                 + "/actions/runs/" + os.environ["GITHUB_RUN_ID"] + "/artifacts?" + query)
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "Cache-Control": "no-cache",
                     "X-GitHub-Api-Version": "2022-11-28"}
          deadline = time.monotonic() + 30
          last = "metadata not yet visible"
          ready = False
          for attempt in range(1, 16):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  break
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=min(5, remaining)) as response:
                      result = json.load(response)
                  matches = [a for a in result.get("artifacts", []) if a.get("name") == name]
                  if len(matches) > 1 or result.get("total_count", 0) > 100:
                      raise SystemExit("Pages artifact metadata is ambiguous for " + name
                                       + "; refusing deployment")
                  if len(matches) == 1 and not matches[0].get("expired", False):
                      print("Pages artifact ready: " + name + " (exactly one match)")
                      ready = True
                      break
                  last = "artifact missing or expired"
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      raise SystemExit("Pages artifact metadata access denied (HTTP "
                                       + str(error.code) + "); actions:read permission required")
                  last = "artifact API HTTP " + str(error.code)
              except (urllib.error.URLError, TimeoutError, OSError, ValueError) as error:
                  last = "artifact API " + type(error).__name__
              remaining = deadline - time.monotonic()
              if attempt < 15 and remaining > 0:
                  time.sleep(min(2, remaining))
          if not ready:
              raise SystemExit("Pages artifact not ready within 30 seconds/15 attempts: "
                               + name + "; " + last)
          PYTHON
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.deploy.outputs.source_sha }}
      - name: Verify actual public Pages commit and asset hashes
        run: |
          set -o pipefail
          python3 scripts/deployment_provenance.py verify --commit "${{ needs.deploy.outputs.source_sha }}" --attempts 20 --delay 6 2>&1 | tee production-verification.log
      - name: Upload deployed release verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radio-atlas-production-provenance
          path: production-verification.log
          if-no-files-found: warn
