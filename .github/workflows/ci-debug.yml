name: CI Debug (temporary)

on:
  push:
    branches: ['feat/sdr5-kiwi-band-scanner']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Capture diagnostics
        run: |
          node --test tests/*.test.cjs > full-test-output.txt 2>&1 || true
          {
            echo '=== failing tests (names) ==='
            grep -n '^not ok' full-test-output.txt || echo 'none'
            echo '=== failure detail blocks ==='
            grep -n -A 45 '^not ok' full-test-output.txt || true
            echo '=== summary ==='
            grep -E '^# (tests|pass|fail)' full-test-output.txt || true
          } > ci-debug.log 2>&1
          cat ci-debug.log
      - name: Commit debug log
        run: |
          git config user.name "ci-debug-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci-debug.log
          git commit -m "chore(debug): capture failing test details"
          git push origin HEAD:feat/sdr5-kiwi-band-scanner
