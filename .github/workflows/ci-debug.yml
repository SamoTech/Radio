name: CI debug (temporary)
on:
  push:
    branches: [feat/sdr9-snd-allowlist]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Replicate validate steps with full log
        run: |
          {
            echo '== docs-sync =='
            V=$(grep -oE 'radio-atlas-v[0-9]+' sw.js | head -n1 | sed 's/.*-v//')
            echo "sw version: $V"
            grep -qE "v${V}([^0-9]|$)" README.md && echo 'README ok' || echo 'README MISSING'
            grep -qE "v${V}([^0-9]|$)" ROADMAP.md && echo 'ROADMAP ok' || echo 'ROADMAP MISSING'
            echo '== node checks =='
            node --check js/app.js && echo 'app.js ok' || echo 'app.js FAIL'
            for f in js/modules/*.mjs; do node --check "$f" || echo "FAIL $f"; done
            node --check proxy/kiwi-worker.js && echo 'worker ok' || echo 'worker FAIL'
            node --check proxy/kiwi-quota.js && echo 'quota ok' || echo 'quota FAIL'
            echo '== node --test =='
            node --test tests/*.test.cjs 2>&1 | tail -60
          } > ci-debug.log 2>&1 || true
          tail -70 ci-debug.log
      - name: Commit debug log
        run: |
          git config user.name "radio-atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ci-debug.log
          git commit -m "ci: debug log for sdr9 branch"
          git push
