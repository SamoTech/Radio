name: CI Debug
on:
  push:
    branches:
      - feat/sdr7-eibi-hints
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Reproduce validate steps with a committed log
        run: |
          set -o pipefail
          {
            echo "=== docs sync ==="
            V=$(grep -oE "radio-atlas-v[0-9]+" sw.js | head -n1 | sed "s/.*-v//")
            echo "sw version: $V"
            grep -qE "v${V}([^0-9]|$)" README.md && echo README_OK || echo README_MISSING
            grep -qE "v${V}([^0-9]|$)" ROADMAP.md && echo ROADMAP_OK || echo ROADMAP_MISSING
            echo "=== syntax ==="
            node --check js/app.js && echo OK_APP || true
            for f in js/modules/*.mjs; do node --check "$f" && echo "OK $f" || true; done
            echo "=== tests ==="
            node --test tests/*.test.cjs
            echo "=== done ==="
          } > ci-debug.log 2>&1 || true
          tail -n 150 ci-debug.log
      - name: Commit log
        run: |
          git config user.name "ci-debug-bot"
          git config user.email "actions@github.com"
          git add ci-debug.log
          git commit -m "chore(debug): ci-debug.log" || echo "nothing to commit"
          git push