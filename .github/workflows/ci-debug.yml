name: CI Debug

on:
  workflow_dispatch:
  push:
    branches: [feat/sdr6-connection-resilience]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Run validate steps with logging
        run: |
          set +e
          {
            V=$(grep -oE 'radio-atlas-v[0-9]+' sw.js | head -n1 | sed 's/.*-v//')
            echo "sw version: [$V]"
            grep -nE "v${V}([^0-9]|$)" README.md >/dev/null && echo "README v${V} OK" || echo "README v${V} MISSING"
            grep -nE "v${V}([^0-9]|$)" ROADMAP.md >/dev/null && echo "ROADMAP v${V} OK" || echo "ROADMAP v${V} MISSING"
            echo '--- node --check js/app.js'
            node --check js/app.js && echo OK
            echo '--- node --check modules'
            for f in js/modules/*.mjs; do node --check "$f" && echo "$f OK" || echo "$f FAIL"; done
            echo '--- node --test (summary)'
            node --test tests/*.test.cjs > test-full.log 2>&1
            echo "test exit: $?"
            grep -E "^not ok" test-full.log | head -40
            grep -cE "^ok" test-full.log
            echo '--- failing test details'
            grep -A 25 "^not ok" test-full.log | head -160
          } > ci-debug.log 2>&1
          if git diff --quiet && git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git config user.name "ci-debug-bot"
          git config user.email "ci-debug-bot@users.noreply.github.com"
          git add ci-debug.log test-full.log
          git commit -m "chore(debug): commit ci debug logs [skip ci]"
          git push
