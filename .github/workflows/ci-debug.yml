name: CI debug (temporary)
on:
  push:
    branches: [feat/sdr9-snd-allowlist]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Replicate validate steps with full log
        run: |
          {
            node --test tests/*.test.cjs 2>&1 | grep -E "^not ok|# fail|Error|expected|actual|operator|stack:" | head -120
            echo '== per-file pass/fail =='
            for f in tests/*.test.cjs; do
              R=$(node --test "$f" 2>&1 | grep -E "^# (pass|fail)" | tr '\n' ' ')
              echo "$f -> $R"
            done
          } > ci-debug.log 2>&1 || true
          cat ci-debug.log
      - name: Commit debug log
        run: |
          git config user.name "radio-atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ci-debug.log
          git commit -m "ci: debug log v2 for sdr9 branch"
          git push
