name: Browser QA Debug (temporary)

on:
  push:
    branches: ['feat/sdr5-kiwi-band-scanner']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ephemeral Chromium QA dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run QA scripts with captured output
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8765/ > /dev/null 2>&1 && break; sleep 1; done
          {
            echo '===== browser_qa.cjs ====='
            node scripts/browser_qa.cjs 2>&1 | tail -n 60
            echo "browser_qa exit: ${PIPESTATUS[0]}"
            echo '===== pwa_upgrade_qa.cjs ====='
            node scripts/pwa_upgrade_qa.cjs 2>&1 | tail -n 60
            echo "pwa exit: ${PIPESTATUS[0]}"
            echo '===== kiwi_audio_qa.cjs ====='
            RADIO_QA_BASE=http://127.0.0.1:8765/ node scripts/kiwi_audio_qa.cjs 2>&1 | tail -n 60
            echo "kiwi exit: ${PIPESTATUS[0]}"
            echo '===== sdr_studio_qa.cjs ====='
            RADIO_QA_BASE=http://127.0.0.1:8765/ node scripts/sdr_studio_qa.cjs 2>&1 | tail -n 80
            echo "studio exit: ${PIPESTATUS[0]}"
            echo '===== openwebrx_audio_qa.cjs ====='
            RADIO_QA_BASE=http://127.0.0.1:8765/ node scripts/openwebrx_audio_qa.cjs 2>&1 | tail -n 60
            echo "owrx exit: ${PIPESTATUS[0]}"
          } > ci-debug.log 2>&1
          kill "$SERVER_PID" 2>/dev/null || true
          cat ci-debug.log
      - name: Commit debug log
        run: |
          git config user.name "ci-debug-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci-debug.log
          git commit -m "chore(debug): capture browser-qa failure details (temporary, to be removed before merge)"
          git push origin HEAD:feat/sdr5-kiwi-band-scanner
