name: CI Debug (temporary)

on:
  push:
    branches: ['feat/sdr5-kiwi-band-scanner']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Capture diagnostics
        run: |
          {
            echo '=== line endings of sdr.mjs (CRLF count) ==='
            printf 'CR count: '
            tr -dc '\r' < js/modules/sdr.mjs | wc -c
            echo '=== marker positions ==='
            grep -c 'var sdrCurrentReceiver' js/modules/sdr.mjs
            grep -n 'var API =' js/modules/sdr.mjs | head -2
            grep -c $'\n\n\nvar API =' js/modules/sdr.mjs || true
            echo '=== direct run of kiwi-scan.test.cjs ==='
            node --test tests/kiwi-scan.test.cjs 2>&1 | head -n 100
          } > ci-debug.log 2>&1
          cat ci-debug.log
      - name: Commit debug log
        run: |
          git config user.name "ci-debug-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci-debug.log
          git commit -m "chore(debug): isolate kiwi-scan test failure (temporary, to be removed before merge)"
          git push origin HEAD:feat/sdr5-kiwi-band-scanner
