name: CI Debug
on:
  push:
    branches: [feat/sdr8-propagation]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Reproduce validate JS gates
        run: |
          {
            echo "=== docs sync ==="
            V=$(grep -oE 'radio-atlas-v[0-9]+' sw.js | head -n1 | sed 's/.*-v//')
            echo "sw version: $V"
            grep -qE "v${V}([^0-9]|$)" README.md && echo README_OK || echo README_FAIL
            grep -qE "v${V}([^0-9]|$)" ROADMAP.md && echo ROADMAP_OK || echo ROADMAP_FAIL
            echo "=== node --check ==="
            node --check js/app.js && echo APP_OK || echo APP_FAIL
            for f in js/modules/*.mjs; do node --check "$f" || echo "MOD_FAIL $f"; done
            echo MOD_CHECKS_DONE
            echo "=== node --test ==="
            node --test tests/*.test.cjs 2>&1 | grep -B 2 -A 60 '^not ok' ; node --test tests/*.test.cjs 2>&1 | tail -n 12
          } > ci-debug.log 2>&1
          git config user.name "radio-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci-debug.log
          git commit -m "chore(ci): record debug log for sdr-8 branch"
          git push