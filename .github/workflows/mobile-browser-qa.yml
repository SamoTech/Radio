name: Radio Atlas Mobile Browser QA

on:
  pull_request:
    paths:
      - scripts/browser_qa.cjs
      - .github/workflows/mobile-browser-qa.yml
      - js/**
      - css/**
      - index.html
      - sw.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ephemeral Chromium QA dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start the checked-out application over localhost
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/radio-atlas-local-server.log 2>&1 &
          echo $! > /tmp/radio-atlas-local-server.pid
          sleep 2
          curl -fsS http://127.0.0.1:8765/ > /dev/null
      - name: Exercise mobile application with real Chromium
        run: node scripts/browser_qa.cjs
      - name: Upload actual screenshots and browser test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radio-atlas-mobile-browser-evidence
          path: artifacts/mobile-browser-qa/
          if-no-files-found: warn
