name: Validate Radio Atlas

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test station search behavior
        run: node --test tests/*.test.cjs
      - name: Compile crawler
        run: python -m py_compile scripts/update_data.py
