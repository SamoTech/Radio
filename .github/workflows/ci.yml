name: Validate Radio Atlas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/p2-seo-genre-language-pages
      - name: Check docs sync (canonical sw.js + version refs)
        run: |
          V=$(grep -oE 'radio-atlas-v[0-9]+' sw.js | head -n1 | sed 's/.*-v//')
          if [ -z "$V" ]; then echo 'No cache version found in sw.js'; exit 1; fi
          grep -qE "v${V}([^0-9]|$)" README.md || { echo 'ERROR: README.md does not mention sw v$V'; exit 1; }
          grep -qE "v${V}([^0-9]|$)" ROADMAP.md || { echo 'ERROR: ROADMAP.md does not mention sw v$V'; exit 1; }
          echo 'Docs sync OK'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile crawler (debug)
        run: python -m py_compile scripts/update_data.py > py-compile-output.txt 2>&1
        continue-on-error: true
      - name: Test crawler URL handling (debug)
        run: python -m unittest discover -s tests -p 'test_*.py' -v > py-test-output.txt 2>&1
        continue-on-error: true
      - name: Publish debug logs
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          git add py-compile-output.txt py-test-output.txt
          git commit -m "ci-debug: capture validate outputs"
          git push
