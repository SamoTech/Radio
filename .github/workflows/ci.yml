name: Validate Radio Atlas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/feat/visitor-leaderboard
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test station search behavior
        run: node --test tests/*.test.cjs > test-output.txt 2>&1
        continue-on-error: true
      - name: Publish test output
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "validate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-output.txt
          if git diff --cached --quiet; then
            echo "no new test output to publish"
          else
            git commit -m "chore: capture validate test output (debug)"
            git push
          fi
      - name: Show test results
        run: |
          cat test-output.txt
          if grep -q "not ok" test-output.txt; then
            exit 1
          fi
      - name: Compile crawler
        run: python -m py_compile scripts/update_data.py
      - name: Test crawler URL handling
        run: python -m unittest discover -s tests -p 'test_*.py'
