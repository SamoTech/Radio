name: Validate Radio Atlas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/p1-a11y-lighthouse
      - name: Check docs sync (canonical sw.js + version refs)
        run: |
          V=$(grep -oE 'radio-atlas-v[0-9]+' sw.js | head -n1 | sed 's/.*-v//')
          if [ -z "$V" ]; then echo 'No cache version found in sw.js'; exit 1; fi
          echo "Canonical service worker: sw.js v$V (registered by js/app.js as ./sw.js)"
          if [ -f js/sw.js ]; then echo 'ERROR: js/sw.js is a stale duplicate - the app registers ./sw.js (repo root)'; exit 1; fi
          grep -qE "v$V([^0-9]|$)" README.md || { echo "ERROR: README.md does not mention sw v$V"; exit 1; }
          grep -qE "v$V([^0-9]|$)" ROADMAP.md || { echo "ERROR: ROADMAP.md does not mention sw v$V"; exit 1; }
          echo 'Docs sync OK: README + ROADMAP carry the live sw version'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - name: Check ES module syntax (js/modules/*.mjs)
        run: |
          for f in js/modules/*.mjs; do node --check "$f"; done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test station search behavior
        run: node --test tests/*.test.cjs > js-test-output.txt 2>&1
        continue-on-error: true
      - name: Compile crawler
        run: python -m py_compile scripts/update_data.py
      - name: Test crawler URL handling
        run: python -m unittest discover -s tests -p 'test_*.py' > py-test-output.txt 2>&1
        continue-on-error: true
      - name: Lighthouse accessibility audit (P1-3 gate: >= 90)
        run: |
          {
          python3 -m http.server 8765 >/dev/null 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Chrome binary: ${CHROME_PATH:-none}"
          npx --yes lighthouse@12 http://localhost:8765/ --quiet \
            --only-categories=accessibility \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" \
            --output=json --output-path=lighthouse-report.json
          kill "$SERVER_PID" 2>/dev/null || true
          if [ -f lighthouse-report.json ]; then
            jq '.categories | {accessibility: .accessibility.score}' lighthouse-report.json || true
            SCORE=$(jq '.categories.accessibility.score * 100 | round' lighthouse-report.json)
          else
            SCORE=""
          fi
          echo "Lighthouse Accessibility score: ${SCORE:-none}"
          jq -r '.audits | to_entries[] | select(.value.score != null and .value.score < 1) | "failing audit: \(.key) — \(.value.title)"' lighthouse-report.json || true
          if [ "${SCORE:-0}" -lt 90 ]; then echo 'ERROR: Lighthouse accessibility score below 90'; exit 1; fi
          } > lh-output.txt 2>&1
        continue-on-error: true
      - name: Publish debug logs
        if: always()
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          git add js-test-output.txt py-test-output.txt lh-output.txt lighthouse-report.json 2>/dev/null || true
          git commit -m "debug: capture validate outputs" || true
          git push
