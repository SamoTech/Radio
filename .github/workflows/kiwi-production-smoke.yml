name: KiwiSDR safe production acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/kiwi_production_smoke.cjs
      - .github/workflows/kiwi-production-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-smoke:
    name: Kiwi P0 non-disruptive HTTP checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Verify script parses
        run: node --check scripts/kiwi_production_smoke.cjs
      - name: Run six bounded read-only Kiwi Worker checks
        run: node scripts/kiwi_production_smoke.cjs
