name: Deep Live QA (temp)
on:
  push:
    branches: [feat/sdr11-qa-soak]
permissions:
  contents: write
jobs:
  deep-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run deep live QA (survey + soak + scanner + offline)
        env:
          KIWI_QA_LIVE: '1'
          KIWI_QA_SURVEY_COUNT: '4'
          KIWI_QA_SOAK_MS: '300000'
          KIWI_QA_SOAK_RECEIVERS: '["http://ea8bfk.ddns.net:8073/"]'
          KIWI_QA_SCANNER: '1'
          KIWI_QA_OFFLINE: '1'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8765/ > /dev/null 2>&1 && break; sleep 1; done
          env | grep -E "^KIWI_QA" | tee -a qa-deep-live.log || true
          RADIO_QA_BASE=http://127.0.0.1:8765/ node scripts/kiwi_audio_qa.cjs 2>&1 | tee -a qa-deep-live.log || true
          echo "=== EXIT MARKER ===" | tee -a qa-deep-live.log
          wc -c qa-deep-live.log | tee -a qa-deep-live.log || true
          ls -la artifacts/kiwi-audio-qa/ 2>&1 | tee -a qa-deep-live.log || true
          cat /tmp/server.log 2>&1 | tail -5 | tee -a qa-deep-live.log || true
      - name: Publish evidence via Node + Contents API
        run: |
          const { execSync } = require("child_process");
          const fs = require("fs");
          const REPO = "SamoTech/Radio";
          const BRANCH = "feat/sdr11-qa-soak";
          const API = "https://api.github.com/repos/" + REPO + "/contents/";
          const AUTH = "Authorization: Bearer " + process.env.GITHUB_TOKEN;
          let dbg = "";
          function putFile(file, msg) {
            try {
              if (!fs.existsSync(file) || fs.statSync(file).size === 0) { dbg += "MISSING " + file + "\n"; return; }
              const b64 = fs.readFileSync(file).toString("base64");
              let sha = "";
              try {
                const got = JSON.parse(execSync("curl -sS -H \"" + AUTH + "\" \"" + API + file + "?ref=" + BRANCH + "\"").toString());
                sha = got.sha || "";
              } catch (e) { sha = ""; }
              const body = { message: msg, content: b64, branch: BRANCH };
              if (sha) body.sha = sha;
              let out = "";
              try {
                out = execSync("curl -sS -X PUT -H \"" + AUTH + "\" -H \"Accept: application/vnd.github+json\" \"" + API + file + "\" -d @-", { input: JSON.stringify(body) }).toString();
                dbg += file + " -> OK " + out.slice(0, 120) + "\n";
              } catch (e) {
                dbg += file + " -> ERR " + String(e).slice(0, 300) + "\n";
              }
            } catch (e) { dbg += file + " -> FATAL " + String(e).slice(0, 300) + "\n"; }
          }
          try { dbg += "cwd=" + process.cwd() + "\n"; dbg += "files=" + JSON.stringify(fs.readdirSync(".").slice(0, 40)) + "\n"; } catch (e) {}
          putFile("qa-deep-live.log", "chore(qa): deep live log via API (node)");
          putFile("artifacts/kiwi-audio-qa/report.json", "chore(qa): deep live report via API (node)");
          fs.writeFileSync("api-debug.txt", dbg);
          putFile("api-debug.txt", "chore(qa): api debug via API (node)");
          console.log(dbg);
