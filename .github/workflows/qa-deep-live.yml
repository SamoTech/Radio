name: Deep Live QA (temp)
on:
  push:
    branches: [feat/sdr11-qa-soak]
permissions:
  contents: write
jobs:
  deep-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run deep live QA (survey + soak + scanner + offline)
        env:
          KIWI_QA_LIVE: '1'
          KIWI_QA_SURVEY_COUNT: '8'
          KIWI_QA_SOAK_MS: '300000'
          KIWI_QA_SOAK_RECEIVERS: '["http://ea8bfk.ddns.net:8073/"]'
          KIWI_QA_SCANNER: '1'
          KIWI_QA_OFFLINE: '1'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8765/ > /dev/null 2>&1 && break; sleep 1; done
          RADIO_QA_BASE=http://127.0.0.1:8765/ node scripts/kiwi_audio_qa.cjs 2>&1 | tee qa-deep-live.log || true
          ls -la artifacts/kiwi-audio-qa/ 2>&1 | tee -a qa-deep-live.log || true
      - name: Publish evidence via Contents API (race-free)
        env:
          TARGET_BRANCH: feat/sdr11-qa-soak
        run: |
          set -x
          API="https://api.github.com/repos/SamoTech/Radio/contents"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          put_file() {
            FILE="$1"; MSG="$2"
            if [ ! -s "$FILE" ]; then echo "MISSING $FILE" | tee -a api-debug.txt; return 0; fi
            SHA="$(curl -sS -H "$AUTH" "$API/$FILE?ref=$TARGET_BRANCH" | jq -r ".sha // empty" 2>/dev/null || true)"
            if [ -n "$SHA" ]; then
              BODY="$(jq -n --arg msg "$MSG" --arg c "$(base64 -w0 "$FILE")" --arg sha "$SHA" --arg br "$TARGET_BRANCH" '{message:$msg,content:$c,sha:$sha,branch:$br}')"
            else
              BODY="$(jq -n --arg msg "$MSG" --arg c "$(base64 -w0 "$FILE")" --arg br "$TARGET_BRANCH" '{message:$msg,content:$c,branch:$br}')"
            fi
            CODE="$(printf '%s' "$BODY" | curl -sS -o /tmp/api-resp.json -w '%{http_code}' -X PUT -H "$AUTH" -H "Accept: application/vnd.github+json" "$API/$FILE" -d @- || true)"
            echo "$FILE -> HTTP $CODE $(head -c 120 /tmp/api-resp.json 2>/dev/null)" | tee -a api-debug.txt
          }
          rm -f api-debug.txt
          put_file "qa-deep-live.log" "chore(qa): deep live log via API to feature branch"
          put_file "artifacts/kiwi-audio-qa/report.json" "chore(qa): deep live report via API to feature branch"
          put_file "api-debug.txt" "chore(qa): api debug to feature branch"
